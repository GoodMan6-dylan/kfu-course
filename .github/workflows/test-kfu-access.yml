name: Test KFU Banner access

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe six public section pages
        shell: bash
        run: |
          set -u
          workdir=$(mktemp -d)
          trap 'rm -rf -- "$workdir"' EXIT
          printf '| Page | HTTP chain | Final HTTP | Bytes | Redirects | Final URL | Section tables |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '|---|---|---:|---:|---:|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"

          failures=0
          index=0
          for spec in 'eng_m:22:11' 'sci_m:08:11' 'eng-lang_m:00:11' 'eng_f:22:12' 'sci_f:08:12' 'eng-lang_f:00:12'; do
            IFS=: read -r page college sex <<< "$spec"
            url="https://ssb-ar.kfu.edu.sa/PROD_ar/ws?p_trm_code=144810&p_col_code=$college&p_sex_code=$sex"
            headers="$workdir/$page.headers"
            body="$workdir/$page.html"
            result=''
            if result=$(curl --silent --show-error --location --max-redirs 5 \
              --connect-timeout 10 --max-time 40 --user-agent 'Mozilla/5.0' \
              --dump-header "$headers" --output "$body" \
              --write-out '%{http_code}|%{size_download}|%{num_redirects}|%{url_effective}' \
              "$url"); then
              rc=0
            else
              rc=$?
            fi
            IFS='|' read -r code bytes redirects effective <<< "$result"
            chain=$(awk '/^HTTP\// { gsub("\r", "", $2); if (out != "") out = out " -> "; out = out $2 } END { print out }' "$headers")
            tables=$(grep -oi 'class="normaltxt"' "$body" | wc -l | tr -d '[:space:]')

            printf '%s: curl=%s http=%s final=%s bytes=%s redirects=%s tables=%s url=%s\n' \
              "$page" "$rc" "$chain" "$code" "$bytes" "$redirects" "$tables" "$effective"
            printf '| %s | %s | %s | %s | %s | %s | %s |\n' \
              "$page" "$chain" "$code" "$bytes" "$redirects" "$effective" "$tables" >> "$GITHUB_STEP_SUMMARY"

            if (( rc != 0 )) || [[ "$code" != 200 ]] || \
              [[ "$effective" != https://ssb-ar.kfu.edu.sa/PROD_ar/ws* ]] || (( tables < 10 )); then
              failures=$((failures + 1))
            fi
            index=$((index + 1))
            if (( index < 6 )); then sleep 2; fi
          done

          if (( failures > 0 )); then
            printf '%s of 6 pages did not return Banner section data.\n' "$failures" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
